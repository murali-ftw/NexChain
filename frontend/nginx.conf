server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular Router uses client-side (path-based) routing — a direct load
    # or refresh of e.g. /history has no matching file on disk, so fall back
    # to index.html and let the Router take over, instead of an nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
