<div class="history-page">
  <header class="history-page__header">
    <h1>Query History</h1>
    <input class="history-page__search" type="text" placeholder="Search past queries..." />
  </header>

  @if (items.length === 0) {
    <p class="history-page__empty">You haven't asked anything yet.</p>
  } @else {
    <ul class="history-page__list">
      @for (item of items; track item.timestamp) {
        <li class="history-item">
          <div class="history-item__question">{{ item.question }}</div>
          <div class="history-item__summary">{{ item.summary }}</div>
          <div class="history-item__timestamp">{{ item.timestamp }}</div>
        </li>
      }
    </ul>
  }
</div>
