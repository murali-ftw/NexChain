<div class="login">
  <div class="login__card">
    <div class="login__logo">SC</div>
    <h1 class="login__title">Supply Chain Intelligence Co-Pilot</h1>
    <p class="login__subtitle">Sign in to ask about orders, shipments, inventory and SLAs.</p>

    <form class="login__form" (submit)="$event.preventDefault(); onSignIn()">
      <label class="login__label" for="email">Email</label>
      <input
        class="login__input"
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="you@company.com"
        [(ngModel)]="email"
        [disabled]="submitting()"
      />

      <label class="login__label" for="password">Password</label>
      <input
        class="login__input"
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••"
        [(ngModel)]="password"
        [disabled]="submitting()"
      />

      @if (errorMessage()) {
        <p class="login__error" role="alert">{{ errorMessage() }}</p>
      }

      <button class="login__submit" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
