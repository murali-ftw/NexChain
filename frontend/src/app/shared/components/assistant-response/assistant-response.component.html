<article class="response" role="article" aria-label="Assistant response">
  <header class="response__header">
    <span class="response__avatar" aria-hidden="true">AI</span>
    <div class="response__headline" [innerHTML]="response.answerText | markdownLite"></div>
  </header>

  @if (hasCardContent()) {
    <dl class="response__cards">
      <app-status-card [orderStatus]="response.orderStatus" />
      <app-shipment-card [shipmentStatus]="response.shipmentStatus" [currentLocation]="response.currentLocation" />
      <app-delay-card [delayReason]="response.delayReason" [delayDays]="response.delayDays" />
      <app-sla-card
        [slaStatus]="response.slaStatus"
        [promisedDeliveryDate]="response.promisedDeliveryDate"
        [revisedDeliveryDate]="response.revisedDeliveryDate"
      />
    </dl>
  }

  <app-recommendations-card [actions]="response.recommendedActions" />

  <footer class="response__footer">
    <app-sources-card [intent]="response.intent" [sources]="response.sources" />
    <app-metadata-footer
      [traceId]="response.traceId"
      [timestamp]="response.timestamp"
      [error]="response.error"
      [warnings]="response.warnings"
      [partial]="response.partial"
    />
  </footer>
</article>
