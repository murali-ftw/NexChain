<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__logo">SC</span>
    <span class="sidebar__title">Supply Chain Co-Pilot</span>
  </div>

  <nav class="sidebar__nav">
    <a class="sidebar__link" routerLink="/chat" routerLinkActive="sidebar__link--active">
      Chat
    </a>
    <a class="sidebar__link" routerLink="/history" routerLinkActive="sidebar__link--active">
      History
    </a>
    <a class="sidebar__link" routerLink="/audit" routerLinkActive="sidebar__link--active">
      Audit
    </a>
  </nav>

  <div class="sidebar__footer">
    <span class="sidebar__user">Signed in as Demo User</span>
    <span class="sidebar__status" [class]="'sidebar__status--' + backendStatus()">
      @switch (backendStatus()) {
        @case ('checking') { Backend: checking... }
        @case ('up') { Backend: connected }
        @case ('unreachable') { Backend: unreachable }
      }
    </span>
  </div>
</aside>
