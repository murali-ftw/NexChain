version: 2
# Version-update scanning (maven/npm/pip/github-actions) is intentionally
# disabled: it kept reopening the same branches/PRs every weekly scan as long
# as a dependency stayed behind, regardless of how often the branches were
# pruned. To re-enable, restore per-ecosystem entries under `updates`, e.g.:
#
#   updates:
#     - package-ecosystem: maven
#       directory: /backend-api
#       schedule:
#         interval: weekly
#
# Note: this only turns off *version-update* PRs. GitHub's separate
# Dependabot *security alerts* (vulnerability notifications) are a repo
# Settings toggle, not controlled by this file, and are unaffected.
updates: []
