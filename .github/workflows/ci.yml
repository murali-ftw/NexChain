name: CI

# Runs the build/test suites verified manually during the Day 11 platform
# audit and the Day 12 release-hardening pass: Spring Boot (mvn verify),
# Angular (build + Chrome/Firefox headless unit tests), and Python
# (ruff + mypy + pytest + the completion-gate scripts, against a live
# mcp_server as of Day 12 — ai/mcp_client.py needs one, see ai/CONTRACTS.md
# §11). Three independent jobs — no cross-dependency, same as running them
# locally. Dependency-vulnerability scanning (npm audit / pip-audit) runs
# inline per-push; Maven and cross-ecosystem update tracking is
# .github/dependabot.yml instead (see its comment for why).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Spring Boot (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # pom.xml pins <java.version>25</java.version> — verified by
          # actually building the Docker image against JDK 21 first and
          # watching it fail ("release version 25 not supported").
          java-version: "25"
          cache: maven
      - name: mvn clean verify
        working-directory: backend-api
        run: mvn -B clean verify

  frontend:
    name: Angular (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: browser-actions/setup-firefox@v1
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm audit (fail only on high/critical — see README "Known limitations" for the accepted moderate findings and why)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: ng build --configuration production
        working-directory: frontend
        run: npx ng build --configuration production
      - name: ng test (Chrome + Firefox headless)
        working-directory: frontend
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: npx ng test --watch=false --browsers=ChromeHeadless,FirefoxHeadless

  python:
    name: Python (ruff + mypy + pytest + gates)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_pw
          POSTGRES_DB: nexchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      COPILOT_READONLY_PASSWORD: ci_readonly_pw
      COPILOT_APP_PASSWORD: ci_app_pw
      MOCK_API_DATABASE_URL: postgresql://copilot_readonly:ci_readonly_pw@localhost:5432/nexchain
      AI_SERVICE_DATABASE_URL: postgresql://copilot_readonly:ci_readonly_pw@localhost:5432/nexchain
      MOCK_API_BASE_URL: http://localhost:8000
      # Day 12: db_boundary.py/api_boundary.py now call mcp_server over a real
      # MCP ClientSession (ai/mcp_client.py, ai/CONTRACTS.md §11) instead of
      # importing ai_service/tools/* directly — mcp_server must be a live,
      # reachable process for pytest and the completion gates below to pass.
      MCP_SERVER_URL: http://localhost:8002/mcp
      # Configure this as a repo/environment secret to exercise the real,
      # non-degraded LLM path in CI. Without it, ai_service/test_ai_service.py's
      # one live-pipeline test fails the same way it does locally with no key
      # (LLM_PRIMARY_API_KEY not set -> partial:true) — every other test is
      # unaffected, since the graph degrades gracefully rather than crashing.
      LLM_PRIMARY_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply DB migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGPASSWORD: ci_postgres_pw
          POSTGRES_USER: postgres
          POSTGRES_DB: nexchain
        run: |
          psql -h localhost -U postgres -d nexchain -f db/migrations/001_init_schema.sql
          sh db/migrations/002_roles.sh
          psql -h localhost -U postgres -d nexchain -f db/seed_data.sql
      - name: Ingest knowledge base (RAG)
        run: python -m ai.rag.ingest
      - name: Start mock_apis
        run: |
          nohup uvicorn mock_apis.main:app --host 0.0.0.0 --port 8000 > mock_apis.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'
      - name: Start mcp_server
        env:
          MCP_TRANSPORT: streamable-http
        run: |
          nohup python -m mcp_server.server > mcp_server.log 2>&1 &
          timeout 30 bash -c 'until curl -s -o /dev/null http://localhost:8002/mcp; do sleep 1; done'
      - name: pip-audit (report only — see README "Known limitations" for the one accepted finding and why)
        run: pip-audit -r requirements.txt || true
      - name: ruff check
        run: ruff check ai ai_service mcp_server mock_apis
      - name: ruff format --check
        run: ruff format --check ai ai_service mcp_server mock_apis
      - name: mypy
        run: mypy ai ai_service mcp_server mock_apis
      - name: pytest
        run: pytest ai/ ai_service/ mcp_server/ mock_apis/ -q
      - name: Completion gate — P3.8 routing
        run: python -m ai.graph.eval
      - name: Completion gate — P3.10 business rules
        run: python -m ai.agents.business_rule_agent.eval
      - name: Completion gate — P3.11 final response
        run: python -m ai.graph.eval_final_response
