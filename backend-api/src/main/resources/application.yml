spring:
  application:
    name: backend-api
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  # P1.7 rectification: conversation history now survives a restart. This is a file
  # local to backend-api's own process — not Person 2's shared `nexchain` Postgres
  # database, and not something docker-compose or db/migrations needs to know about.
  datasource:
    url: jdbc:h2:file:./data/nexchain-history;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8080

logging:
  level:
    root: INFO
    # Override to DEBUG locally (env var, not a committed change) to see
    # request/response bodies-adjacent diagnostic detail from this app's own
    # code — never enable DEBUG here in a shared/production environment, since
    # it is the level where request payload shapes and query parameters may
    # surface. See README.md "Logging" for the full DEBUG-safety note.
    com.nexchain.backend: ${LOG_LEVEL:INFO}

app:
  cors:
    # Comma-separated list; Angular dev server default port. No wildcard.
    allowed-origins: http://localhost:4200
  jwt:
    # Dev-only default (HS256 needs >= 32 bytes). Override via the JWT_SECRET
    # env var in any real deployment — see docs/02_technical_requirements.md §8.
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-replace-via-JWT_SECRET-env-var}
    # Seconds. docs/api_contracts.md's frozen POST /api/auth/login contract
    # already documents expiresIn: 3600 — keep this in sync with that.
    expiration-seconds: 3600
  demo-users:
    # InMemoryUserStore seed passwords (docs Known Limitations: this is a demo
    # user directory, not real user management). Defaults are public in this
    # repo — override via DEMO_ADMIN_PASSWORD etc. before any non-local deployment.
    user-password: ${DEMO_USER_PASSWORD:password}
    second-user-password: ${DEMO_SECOND_USER_PASSWORD:password}
    admin-password: ${DEMO_ADMIN_PASSWORD:password}

ai:
  service:
    # P1.10: Person 2's FastAPI AI service (ai_service/main.py, uvicorn default port 8001).
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
    connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:3000}
    # Generous: a full LangGraph run can chain several sequential LLM/tool calls
    # (flagship: text-to-sql + api-status + knowledge-base + business-rule).
    read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:35000}
